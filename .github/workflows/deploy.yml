name: 部署到宝塔服务器

# 触发条件：push 到 main 分支，或手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: rsync 部署
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: rsync 同步到服务器
        uses: burnett01/rsync-deployments@7.0.2
        with:
          # -a 归档, -v 详细, -z 压缩, --delete 删除服务器上多余的代码文件
          # --exclude 排除：
          #   大模型文件（不在 git 仓库，服务器手动放入，不能删）
          #   宝塔系统文件（.user.ini 无权限删、.well-known SSL 验证、.htaccess 站点配置）
          switches: -avz --delete --exclude='models/asr/paraformer.onnx' --exclude='models/tts/model.onnx' --exclude='models/tts-backup-aishell3/' --exclude='.git/' --exclude='dev-server.py' --exclude='dev-server.crt' --exclude='dev-server.key' --exclude='char-dict.template.html' --exclude='.user.ini' --exclude='.well-known/' --exclude='.htaccess' --exclude='index.html' --exclude='404.html'
          path: ./
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_SSH_KEY }}
          remote_port: ${{ secrets.DEPLOY_PORT }}
