name: 配置讯飞引擎（手动）

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 写入讯飞密钥并重启语音服务
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          XFYUN_APP_ID: ${{ secrets.XFYUN_APP_ID }}
          XFYUN_API_KEY: ${{ secrets.XFYUN_API_KEY }}
          XFYUN_API_SECRET: ${{ secrets.XFYUN_API_SECRET }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/voice_deploy_key
          chmod 600 ~/.ssh/voice_deploy_key
          SSH="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i ~/.ssh/voice_deploy_key -p ${SSH_PORT:-22}"
          $SSH "$SSH_USER@$SSH_HOST" "XFYUN_APP_ID='$XFYUN_APP_ID' XFYUN_API_KEY='$XFYUN_API_KEY' XFYUN_API_SECRET='$XFYUN_API_SECRET' bash -s" < .github/scripts/setup-xfyun.sh
