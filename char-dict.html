<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FF9D3C">
<title>查字宝 - 儿童查字</title>
<script src="models/strokes/hanzi-writer.min.js"></script>

<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:none;}
html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#FFF8EC;color:#2D2A26;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#app{height:100dvh;max-width:100%;margin:0;display:flex;flex-direction:column;background:#FFF8EC;overflow:hidden;padding:0;}
#home,#results,#detail,#history{flex:1;min-height:0;display:none;flex-direction:column;overflow:hidden;}
#home{display:flex;justify-content:center;align-items:center;gap:clamp(4px,.8vh,14px);padding:clamp(8px,2vh,24px) 20px;overflow:hidden;}
#results.show,#detail.show,#history.show{display:flex;}
.home-brand{font-size:clamp(18px,2.4vh,26px);font-weight:800;letter-spacing:4px;color:#BB8C4F;display:flex;align-items:center;gap:clamp(6px,1vh,10px);flex-shrink:0;}
.home-brand .logo{width:clamp(36px,5vh,56px);height:clamp(36px,5vh,56px);border-radius:clamp(12px,1.5vh,16px);background:linear-gradient(135deg,#FF7A00,#FF9D3C);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,3vh,30px);font-weight:800;color:#fff;}
#recBtn{width:min(36vh,300px);height:min(36vh,300px);border-radius:50%;border:0;background:linear-gradient(135deg,#FF7A00,#FF9D3C);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;cursor:pointer;position:relative;flex-shrink:0;box-shadow:0 8px 30px rgba(255,122,0,.3),inset 0 -4px 8px rgba(0,0,0,.08);animation:breath 3s ease-in-out infinite;}
#recBtn .mic{font-size:clamp(50px,8vh,90px);line-height:1;margin-bottom:2px;}
#recBtn .hint{font-size:clamp(16px,2.4vh,24px);font-weight:700;letter-spacing:2px;opacity:.9;}
#recBtn.holding{background:linear-gradient(135deg,#FF5A5F,#FF7A7A);box-shadow:0 8px 30px rgba(255,90,95,.4);animation:none;transform:scale(.95);}
#recBtn .rec-state{display:none;flex-direction:column;align-items:center;gap:clamp(6px,1vh,10px);}
#recBtn.holding .rec-state{display:flex;}
#recBtn.holding .mic,#recBtn.holding .hint{display:none;}
#recBtn .rec-wave{display:flex;align-items:center;gap:6px;height:clamp(32px,5vh,48px);}
#recBtn .rec-wave i{width:8px;border-radius:5px;background:#fff;height:14px;}
#recBtn .rec-ring{width:clamp(40px,6.5vh,64px);height:clamp(40px,6.5vh,64px);border-radius:50%;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite;display:none;}
#recBtn .rec-dots{display:none;align-items:center;gap:clamp(6px,1vh,9px);height:clamp(32px,5vh,48px);}
#recBtn .rec-dots i{width:clamp(10px,1.6vh,14px);height:clamp(10px,1.6vh,14px);border-radius:50%;background:#FFD9E8;animation:dotJump .8s ease-in-out infinite;}
#recBtn .rec-dots i:nth-child(2){background:#FFE9B8;animation-delay:.13s;}
#recBtn .rec-dots i:nth-child(3){background:#E5D4FF;animation-delay:.26s;}
@keyframes dotJump{0%,100%{transform:translateY(0) scale(1);opacity:.5}50%{transform:translateY(-30%) scale(1.2);opacity:1}}
#recBtn .rec-txt{font-size:clamp(16px,2.4vh,22px);font-weight:700;letter-spacing:2px;color:#fff;}
#recBtn .rec-txt.recognizing{animation:recPulse 1.2s ease-in-out infinite;}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.4}}
#recStatusPill{position:fixed;left:50%;bottom:clamp(46px,12vh,100px);transform:translateX(-50%);z-index:60;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:clamp(10px,1.6vh,14px) clamp(18px,3vw,26px);display:none;align-items:center;gap:10px;font-size:clamp(15px,2.2vh,20px);font-weight:700;color:#2D2A26;letter-spacing:1px;white-space:nowrap;}
#recStatusPill .pill-wave{display:flex;align-items:center;gap:5px;height:clamp(24px,3.5vh,34px);}
#recStatusPill .pill-wave i{width:7px;border-radius:4px;background:#FF9D3C;height:10px;}
#recStatusPill #pillTxt.recognizing{animation:recPulse 1.2s ease-in-out infinite;}
@keyframes breath{0%,100%{box-shadow:0 8px 30px rgba(255,122,0,.3);}50%{box-shadow:0 8px 50px rgba(255,122,0,.5);}}
.voice-sub{font-size:clamp(14px,2vh,20px);color:#B8A080;letter-spacing:1px;flex-shrink:0;}
.alt-zone{width:100%;max-width:560px;flex-shrink:0;display:flex;flex-direction:column;gap:clamp(6px,1vh,14px);}
#searchBox{display:flex;align-items:center;gap:clamp(6px,1vh,10px);border:2px solid #F0E0C8;border-radius:18px;background:#fff;padding:clamp(8px,1.5vh,18px) clamp(12px,2vw,20px);box-shadow:0 2px 8px rgba(0,0,0,.04);}
#searchBox .icon{font-size:clamp(18px,2.5vh,22px);}
#searchInput{flex:1;border:0;outline:0;background:transparent;font-size:clamp(16px,2.2vh,22px);color:#2D2A26;-webkit-user-select:text;user-select:text;}
#searchInput::placeholder{color:#C8BCA8;}
#clearBtn{display:none;font-size:16px;color:#fff;background:#D8CCB6;border:0;border-radius:50%;width:32px;height:32px;flex-shrink:0;}
#historyBtn{width:100%;font-size:clamp(16px,2.2vh,20px);font-weight:700;border:2px solid #F0E0C8;border-radius:18px;padding:clamp(10px,1.5vh,16px);background:#fff;color:#2D2A26;box-shadow:0 2px 8px rgba(0,0,0,.04);}
#historyBtn .n{font-size:clamp(14px,1.8vh,16px);color:#BB8C4F;font-weight:400;}
#warnBanner{display:none;width:100%;max-width:560px;background:#FFF0E6;border:2px solid #FF8C42;color:#8a4b00;border-radius:14px;padding:clamp(10px,1.5vh,18px) clamp(14px,2vw,20px);font-size:clamp(13px,1.8vh,15px);line-height:1.5;}
/* 结果页 */
#results .r-title{font-size:clamp(18px,3vh,28px);font-weight:800;text-align:center;margin-top:clamp(4px,.6vh,12px);flex-shrink:0;}
#results .r-sub{font-size:clamp(14px,2vh,18px);color:#B8A080;text-align:center;flex-shrink:0;}
#resMainArea{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(8px,1.2vh,16px);padding:clamp(4px,.8vh,12px) clamp(12px,2vw,20px);overflow:hidden;}
#resultChars{display:flex;justify-content:center;align-items:center;gap:clamp(12px,2vh,24px);flex-wrap:wrap;flex-shrink:0;}
.char-card{min-width:clamp(120px,15vw,220px);flex:1;max-width:clamp(170px,27vw,280px);background:#fff;border:3px solid #FFE0B8;border-radius:clamp(14px,2vh,24px);padding:clamp(12px,2vh,24px) clamp(12px,1.8vw,18px) clamp(12px,2vh,22px);display:flex;flex-direction:column;align-items:center;box-shadow:0 6px 20px rgba(255,122,0,.12);transition:transform .12s,border-color .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.char-card .zi{font-size:clamp(82px,13vh,150px);line-height:1.1;font-weight:700;font-family:"Kaiti SC",STKaiti,"Songti SC","Noto Serif SC",serif;}
.char-card .py{font-size:clamp(20px,3vh,30px);color:#BB8C4F;font-weight:700;margin-top:clamp(3px,.5vh,8px);}
.char-card .spk{width:clamp(42px,6vh,60px);height:clamp(42px,6vh,60px);border-radius:50%;border:3px solid #FFE0B8;margin-top:clamp(6px,1vh,14px);background:#fff;color:#2D2A26;font-size:clamp(18px,3vh,26px);flex-shrink:0;transition:transform .12s,background .12s;}
.char-card .spk.playing{background:#FF9D3C;border-color:#FF9D3C;color:#fff;}
.char-card:active,.char-card.pressed{transform:scale(.96);border-color:#FF9D3C;}
/* 详情页 */
#detailBody{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(2px,.4vh,8px);overflow:hidden;padding:0 clamp(10px,1.6vw,16px) clamp(4px,.8vh,8px);justify-content:center;}
.char-hero{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border-radius:clamp(14px,2vh,28px);border:3px solid #F0E0C8;padding:clamp(2px,.4vh,8px) clamp(12px,2vw,16px);flex:1;min-height:0;max-height:min(44vh,430px);box-shadow:0 4px 16px rgba(0,0,0,.04);}
#detailPinyin{font-size:clamp(18px,3vh,32px);color:#BB8C4F;font-weight:700;letter-spacing:6px;margin-bottom:clamp(1px,.3vh,6px);}
#detailChar{font-size:min(30vh,320px);font-weight:700;line-height:1.05;cursor:pointer;transition:transform .15s;font-family:"Kaiti SC",STKaiti,"Songti SC","Noto Serif SC",serif;max-width:100%;overflow:hidden;white-space:nowrap;}
#detailChar:active,#detailChar.pressed{transform:scale(.88);}
#detailMeta{font-size:clamp(11px,1.6vh,14px);color:#C8BCA8;margin-top:clamp(1px,.3vh,4px);}
#radSection{flex-shrink:0;}
.rad-card{background:#FFF8E7;border:3px solid #FFE0B8;border-radius:clamp(12px,1.8vh,22px);padding:clamp(4px,.8vh,10px) clamp(10px,1.8vw,18px);display:flex;align-items:center;gap:clamp(8px,1.2vh,16px);box-shadow:0 4px 12px rgba(255,157,60,.08);}
.rad-card .rad-badge{width:clamp(36px,5vh,64px);height:clamp(36px,5vh,64px);flex-shrink:0;border-radius:clamp(10px,1.5vh,16px);background:#FFEED6;border:3px solid #FFD8A8;display:flex;align-items:center;justify-content:center;font-size:clamp(24px,4vh,48px);font-weight:700;font-family:"Kaiti SC",STKaiti,serif;}
.rad-card .rad-info{flex:1;min-width:0;}
.rad-card .rad-title{font-size:clamp(13px,2vh,18px);font-weight:800;}
.rad-card .rad-detail{font-size:clamp(11px,1.6vh,14px);color:#8E7550;margin-top:1px;line-height:1.4;}
.rad-card .rad-tip{margin-top:clamp(2px,.4vh,6px);font-size:clamp(11px,1.5vh,13px);color:#4A7CFF;background:#E8F0FF;border-radius:clamp(8px,1vh,12px);padding:clamp(4px,.6vh,8px) clamp(10px,1.5vw,14px);line-height:1.4;}
.sec-label{font-size:clamp(14px,2.2vh,22px);font-weight:800;color:#8E7550;letter-spacing:1px;flex-shrink:0;margin:0;padding-top:clamp(2px,.3vh,6px);}
/* 笔顺区：高度由 JS 按笔画数行数自适应，hero 吃剩余空间 */
#strokes{flex-shrink:0;height:min(30vh,300px);display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:clamp(4px,.5vh,8px);overflow:hidden;padding:0;}
.stroke-cell{position:relative;background:#fff;border:3px solid #F0E0C8;border-radius:clamp(8px,1.2vh,14px);box-shadow:0 3px 8px rgba(0,0,0,.04);cursor:pointer;flex-shrink:0;}
.stroke-cell.playing{border-color:#FF7A00;box-shadow:0 0 0 4px rgba(255,122,0,.25),0 0 16px rgba(255,122,0,.15);}
.stroke-cell svg,.stroke-cell svg *{pointer-events:none;}
.stroke-cell .writer-host{position:absolute;inset:0;border-radius:inherit;overflow:hidden;}
.stroke-cell .writer-host svg{width:100%!important;height:100%!important;}
.stroke-num{position:absolute;right:2px;bottom:1px;font-size:clamp(8px,1.2vh,12px);color:#C8BCA8;font-weight:700;}
/* 组词区 */
#words{display:flex;gap:clamp(6px,1vh,12px);flex-wrap:wrap;flex-shrink:0;margin:0;}
.word-card{min-width:clamp(80px,16vw,140px);flex:1;background:#F6FFF8;border:3px solid #C8E6C9;border-radius:clamp(14px,2vh,20px);padding:clamp(6px,1vh,14px) clamp(6px,1vw,8px) clamp(6px,1vh,12px);display:flex;flex-direction:column;align-items:center;gap:clamp(4px,.6vh,8px);box-shadow:0 4px 12px rgba(76,175,125,.08);cursor:pointer;transition:transform .12s,background .12s,border-color .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.word-card:active,.word-card.pressed{transform:scale(.92);background:#E3F5E8;border-color:#8FCE9E;}
.word-card.playing{background:#FFF4E0;border-color:#FF9D3C;box-shadow:0 4px 14px rgba(255,157,60,.25);}
.word-card .w{font-size:clamp(18px,3vh,30px);font-weight:700;letter-spacing:2px;}
.word-card .w u{text-decoration:none;color:#FF7A00;}
.word-card .mini-spk{display:none;}
/* 历史页 */
.page-head{display:flex;align-items:center;justify-content:space-between;padding:clamp(6px,.8vh,12px) clamp(10px,2vw,16px);min-height:clamp(44px,6vh,60px);flex-shrink:0;margin:clamp(4px,.6vh,8px) clamp(6px,1.2vw,12px);background:#FFFAF5;border-radius:clamp(14px,2vh,24px);box-shadow:0 2px 8px rgba(0,0,0,.04);}
.page-head button{font-size:clamp(16px,2.2vh,20px);border:0;border-radius:18px;padding:clamp(8px,1.5vh,12px) clamp(14px,2vw,22px);font-weight:700;background:#FFEED6;color:#2D2A26;min-height:clamp(40px,5vh,52px);}
.page-head .head-actions{display:flex;align-items:center;gap:clamp(4px,.8vh,8px);}
.page-head button.head-mic{background:linear-gradient(135deg,#FF7A00,#FF9D3C);color:#fff;box-shadow:0 4px 14px rgba(255,122,0,.3);}
.page-head button.center-mic{font-size:clamp(17px,2.4vh,22px);padding:clamp(8px,1.4vh,12px) clamp(16px,2.5vw,26px);border-radius:clamp(18px,3vh,28px);min-height:clamp(44px,5.6vh,56px);}
.page-head button.head-mic.holding{background:linear-gradient(135deg,#FF5A5F,#FF7A7A);transform:scale(.95);}
/* 历史按钮：各页面统一 */
.page-head button.hist-btn{background:#FFEED6;color:#2D2A26;font-size:clamp(17px,2.4vh,21px);}
/* 结果页底部说话按钮 */
.res-speak{width:100%;max-width:300px;margin:0 auto clamp(8px,1.2vh,14px);padding:clamp(10px,1.8vh,16px);border:0;border-radius:16px;background:linear-gradient(135deg,#FF7A00,#FF9D3C);color:#fff;font-size:clamp(18px,2.6vh,24px);font-weight:700;letter-spacing:2px;cursor:pointer;flex-shrink:0;box-shadow:0 4px 16px rgba(255,122,0,.3);}
.res-speak.holding{background:linear-gradient(135deg,#FF5A5F,#FF7A7A);transform:scale(.95);}
/* 横屏（窄高度）结果页更紧凑，14个候选也能一屏放下 */
@media(orientation:landscape){
  #results .r-title{font-size:clamp(14px,1.8vh,18px);margin-top:2px;margin-bottom:2px;}
  #results .r-sub{font-size:clamp(11px,1.4vh,14px);}
  #voiceEcho{margin-top:2px;padding:4px 10px;font-size:clamp(11px,1.5vh,13px);}
  .char-card{min-width:clamp(100px,12vw,160px);max-width:clamp(130px,18vw,200px);padding:clamp(10px,1.6vh,20px) 12px clamp(10px,1.6vh,18px);border-width:2px;border-radius:clamp(10px,1.4vh,16px);}
  .char-card .zi{font-size:clamp(64px,10vh,120px);} /* 实际由 fitResultCards 动态覆盖 */
  .char-card .py{font-size:clamp(16px,2.4vh,24px);margin-top:clamp(2px,.4vh,6px);}
  .char-card .spk{width:clamp(36px,5vh,50px);height:clamp(36px,5vh,50px);font-size:clamp(16px,2.4vh,22px);margin-top:clamp(4px,.6vh,10px);border-width:2px;}
  #resultChars{gap:clamp(8px,1.4vh,16px);}
  #resMainArea{gap:clamp(8px,1.2vh,16px);padding:clamp(4px,.6vh,10px) clamp(10px,1.6vw,16px);}
  .res-speak{padding:clamp(8px,1.2vh,14px);font-size:clamp(16px,2.2vh,22px);max-width:260px;}
}
.page-head .brand{font-size:clamp(16px,2.2vh,20px);font-weight:800;letter-spacing:2px;color:#BB8C4F;}
#voiceEcho{flex-shrink:0;margin:clamp(4px,.6vh,10px) 12px 0;padding:clamp(6px,1vh,10px) clamp(10px,1.5vw,14px);background:#FFF3E0;border-radius:14px;font-size:clamp(13px,1.8vh,15px);color:#8D6E63;line-height:1.6;}
#historyList{flex:1;overflow-y:auto;padding:0 0 12px;}
.h-item{display:flex;align-items:center;gap:clamp(10px,1.5vh,16px);border:3px solid #F0E0C8;border-radius:clamp(16px,2vh,20px);padding:clamp(10px,1.5vh,16px) clamp(12px,2vw,18px);margin-bottom:clamp(6px,1vh,12px);background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.04);}
.h-item .zi{font-size:clamp(32px,4.5vh,44px);font-weight:700;width:clamp(40px,6vh,56px);text-align:center;font-family:"Kaiti SC",STKaiti,serif;flex-shrink:0;}
.h-item .info{flex:1;min-width:0;}
.h-item .info b{font-size:clamp(16px,2.2vh,20px);display:block;font-weight:700;}
.h-item .info span{font-size:clamp(12px,1.6vh,14px);color:#B8A080;}
.h-item .mini-spk{width:clamp(40px,5vh,56px);height:clamp(40px,5vh,56px);border-radius:50%;border:3px solid #F0E0C8;background:#fff;color:#2D2A26;font-size:clamp(18px,2.5vh,24px);flex-shrink:0;}
.h-item .mini-spk.playing{background:#4CAF7D;border-color:#4CAF7D;color:#fff;}
.h-empty{text-align:center;color:#B8A080;font-size:clamp(16px,2.2vh,18px);margin-top:clamp(30px,5vh,60px);line-height:2;}
/* 语音浮层 */
#voiceSheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:50;background:rgba(45,42,38,.8);display:none;flex-direction:column;align-items:center;justify-content:center;}
#voiceSheet.show{display:flex;}
#bubble{width:clamp(160px,22vh,240px);height:clamp(160px,22vh,240px);border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 20px 60px rgba(0,0,0,.15);}
#bubble .state-icon{font-size:clamp(40px,6vh,60px);line-height:1;}
#wave{display:flex;align-items:center;gap:5px;height:clamp(36px,5vh,50px);}
#wave i{width:7px;border-radius:4px;background:#FF9D3C;height:clamp(10px,2vh,14px);}
#bubble .txt{font-size:clamp(16px,2.2vh,20px);font-weight:700;}
#spinRing{width:clamp(70px,11vh,110px);height:clamp(70px,11vh,110px);border-radius:50%;border:7px solid #F0E0C8;border-top-color:#FF9D3C;animation:spin .9s linear infinite;display:none;margin-bottom:6px;}
@keyframes spin{to{transform:rotate(360deg);}}
#bubble.canceling{background:#F5F0E8;}
#bubble.canceling .txt{color:#B8A080;}
#voiceTip{color:#fff;font-size:clamp(14px,1.8vh,16px);margin-top:clamp(12px,2vh,20px);letter-spacing:1px;}
/* 加载层 */
#loadOverlay{position:fixed;left:0;right:0;top:0;bottom:0;z-index:70;background:#FFF8EC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2vh,16px);}
#loadOverlay .logo{width:clamp(50px,7vh,70px);height:clamp(50px,7vh,70px);border-radius:clamp(14px,2vh,20px);background:linear-gradient(135deg,#FF7A00,#FF9D3C);display:flex;align-items:center;justify-content:center;font-size:clamp(26px,4vh,36px);font-weight:800;color:#fff;box-shadow:0 8px 24px rgba(255,122,0,.25);}
#loadOverlay h2{font-size:clamp(22px,3vh,28px);letter-spacing:4px;font-weight:800;color:#BB8C4F;}
#loadBar{width:clamp(180px,30vw,240px);height:clamp(8px,1.2vh,12px);background:#F0E0C8;border-radius:8px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.05);}
#loadBar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#FF7A00,#FF9D3C);border-radius:8px;transition:width .3s;}
#loadText{font-size:clamp(13px,1.8vh,15px);color:#B8A080;}
#loadErr{display:none;max-width:380px;text-align:center;font-size:14px;color:#FF5A5F;line-height:1.6;}
#loadErr button{margin-top:12px;border:0;background:#FF9D3C;color:#fff;border-radius:14px;padding:12px 28px;font-size:16px;font-weight:700;}
#toast{position:fixed;left:50%;bottom:12%;transform:translateX(-50%);background:rgba(45,42,38,.92);color:#fff;font-size:clamp(14px,2vh,16px);padding:clamp(10px,1.8vh,14px) clamp(16px,3vw,24px);border-radius:16px;z-index:80;display:none;white-space:nowrap;}

  if(/[\u4e00-\u9fff][的地得][\u4e00-\u9fff]/.test(text)) return false;      // 有"X的X"指字 → 精确识别
  if(/(?:查|找|是|要|想)[的着][\u4e00-\u9fff]/.test(text)) return false;       // 有指令 → 精确识别
  if(/[\u4e00-\u9fff](?:怎么写|怎么读|是什么|怎么念|是啥)/.test(text)) return false; // 有"怎么写" → 精确识别
  if(/第[一二三四]声/.test(text)) return false;                                    // 有声调指令 → 声调过滤
  var n = 0;
  for(var i=0;i<text.length;i++){ var ch = text[i]; if(/[\u4e00-\u9fff]/.test(ch)) n++; }
  return n >= 2 && n <= 6;
}
// 选字模式：列出句中所有汉字（去停用词去重），让小孩点选要查的字
function showSelectMode(text){
  var seen = {}; var list = [];
  for(var i=0;i<text.length;i++){ var ch = text[i];
    if(!/[\u4e00-\u9fff]/.test(ch)) continue;
    if(!(ch in seen)){ seen[ch]=1; if(DICT[ch]) list.push(ch); }
  }
  $("rTitle").textContent = "📖 你说的是一句话，里面有几个字——点你要查的那个";
  $("rSub").textContent = "想查哪个字，就点哪个";
  var echo = $("voiceEcho");
  if(text){ echo.style.display = "block"; $("voiceEchoTxt").textContent = text; }
  showResultsPage(list, 0);
}
function parseVoiceIntent(text){
  var score = {}; var order = [];
  function add(ch, s){ if(!DICT[ch]) return; if(!(ch in score)){ score[ch]=0; order.push(ch); } score[ch]+=s; }
  var STOP = "的了是就都在有吗呢啊呀吧着过和与及其这那什么怎又很把被让查找是要想";
  // 1. "X的X" 指字模式（也认"得/地"）——"的"后面的字就是孩子想查的字，最高权重
  var re = /([\u4e00-\u9fff])[的地得]([\u4e00-\u9fff])/g; var m;
  while((m = re.exec(text))){ add(m[2], 3); }
  // 2. 指令模式："查X""找X""是X""X怎么写""X是什么"——指令后面的字加权
  var cmd = /(?:查|找|是|要|想)[的着]([\u4e00-\u9fff])/g;
  while((m = cmd.exec(text))){ add(m[1], 3); }
  var wm = /([\u4e00-\u9fff])(?:怎么写|怎么读|是什么|怎么念|是啥)/g;
  while((m = wm.exec(text))){ add(m[1], 3); }
  // 3. 拼音提示（如 wan）——所有同音字加权
  var pys = text.match(/[a-zA-Z]+/g) || [];
  pys.forEach(function(py){ var key = stripTone(py); if(PINYIN[key]) PINYIN[key].forEach(function(c){ add(c, 2); }); });
  // 4. 汉字出现次数——孩子重复说的字就是目标（如"饭碗的碗，吃饭的碗"里"碗"反复出现）
  for(var i=0;i<text.length;i++){ var ch = text[i]; if(!/[\u4e00-\u9fff]/.test(ch)) continue; if(STOP.indexOf(ch)>=0) continue; add(ch, 1); }
  // 5. 句尾汉字加权——孩子常把目标字放句尾（"我吃饭用的那个碗"→碗）
  var tail = text.replace(/[^\u4e00-\u9fff]/g, "");
  if(tail.length){ add(tail[tail.length-1], 3); }
  // 按分数排序，同分按出现顺序
  order.sort(function(a,b){ return score[b]-score[a] || order.indexOf(a)-order.indexOf(b); });
  return order;
}
function showVoiceResults(chars, rawText, toneNum, forceWide){
  // 纯拼音场景（如只说"wan"）/ 单字同音字扩展：显示全部候选（最多14个），让孩子从列表中找到想查的字
  // 指字描述场景（"饭碗的碗"）：精确命中，显示前3个即可
  var isPinyinOnly = !/[\u4e00-\u9fff]/.test((rawText||"").replace(/[。，、？！,.?!；;\s]/g,""));
  var limit = (isPinyinOnly || forceWide) ? 14 : 3;
  var list = chars.filter(function(c){ return DICT[c]; }).slice(0,limit);
  if(!list.length){ toast("字库里还没有这个字"); return; }
  var echo = $("voiceEcho");
  if(rawText){ echo.style.display = "block"; $("voiceEchoTxt").textContent = rawText; }
  $("rSub").textContent = toneNum ? "点一下就能看笔顺和部首（第"+toneNum+"声）" : "点一下就能看笔顺和部首";
  showResultsPage(list, toneNum);
}

  var STOP = "的了是就都在有吗呢啊呀吧着过和与及其这那什么怎又很把被让查找是要想";
  var re = /([\u4e00-\u9fff])[的地得]([\u4e00-\u9fff])/g; var m;
  while((m = re.exec(text))){ add(m[2], 3); }
  var cmd = /(?:查|找|是|要|想)[的着]([\u4e00-\u9fff])/g;
  while((m = cmd.exec(text))){ add(m[1], 3); }
  var wm = /([\u4e00-\u9fff])(?:怎么写|怎么读|是什么|怎么念|是啥)/g;
  while((m = wm.exec(text))){ add(m[1], 3); }
  var pys = text.match(/[a-zA-Z]+/g) || [];
  pys.forEach(function(py){ var key = stripTone(py); if(PINYIN[key]) PINYIN[key].forEach(function(c){ add(c, 2); }); });
  for(var i=0;i<text.length;i++){ var ch = text[i]; if(!/[\u4e00-\u9fff]/.test(ch)) continue; if(STOP.indexOf(ch)>=0) continue; add(ch, 1); }
  var tail = text.replace(/[^\u4e00-\u9fff]/g, "");
  if(tail.length){ add(tail[tail.length-1], 3); }

}
